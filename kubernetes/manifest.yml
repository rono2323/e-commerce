apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbucks-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: starbucks
  template:
    metadata:
      labels:
        app: starbucks
    spec:
      containers:
        - name: starbucks-container
          image: rono23/starbucks:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: HOST
              value: "0.0.0.0"

---
apiVersion: v1
kind: Service
metadata:
  name: starbucks-service
spec:
  type: LoadBalancer
  selector:
    app: starbucks
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
